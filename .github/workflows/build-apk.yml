# Builds the debug APK for the Box app (sideload build).
#
# Lesson from the Verse Garden / YTM builds: do NOT use
# android-actions/setup-android@v3 — it internally runs `sdkmanager tools`
# and the obsolete "tools" package no longer exists, so it fails. Use the
# runner's preinstalled SDK at /usr/local/lib/android/sdk + explicit
# sdkmanager calls instead.
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # TRIAL (2026-11-09): API 37 platform lives outside the stable
          # channel — plain `sdkmanager "platforms;android-37"` fails.
          # Channel 1 (beta) also failed: "Failed to find package
          # 'platforms;android-37'". Second and last variant: channel 3
          # (canary) includes every channel up to canary, so if the
          # platform is published anywhere sdkmanager can see, this
          # finds it. If this fails too, the trial is over — report and
          # stop (the remaining lead would be the new `android` CLI).
          sdkmanager --channel=3 "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          # Google sign-in needs the Desktop client_secret on the token
          # exchange + refresh (see OAuth.kt). Injected from the repo
          # secret into BuildConfig; never printed or committed.
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: box-apk
          path: app/build/outputs/apk/debug/*.apk
