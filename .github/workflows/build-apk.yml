# Builds the debug APK for the Box app (sideload build).
#
# Lesson from the Verse Garden / YTM builds: do NOT use
# android-actions/setup-android@v3 — it internally runs `sdkmanager tools`
# and the obsolete "tools" package no longer exists, so it fails. Use the
# runner's preinstalled SDK at /usr/local/lib/android/sdk + explicit
# sdkmanager calls instead.
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # Trial 2026-11-09 (attempt 2): the API-37 platform is not in
          # sdkmanager's repo on any channel, and the runner's preinstalled
          # cmdline-tools has no `android` binary (command not found).
          # Follow One-UI: download the current cmdline-tools (build
          # 15859902), which ships the new android CLI, and install the
          # version-pinned package from the beta channel with it.
          tools_dir="${RUNNER_TEMP}/android-command-line-tools"
          tools_zip="${RUNNER_TEMP}/commandlinetools-linux-15859902_latest.zip"
          android_cli="${tools_dir}/cmdline-tools/bin/android"
          mkdir -p "${tools_dir}"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "${tools_zip}"
          unzip -q "${tools_zip}" -d "${tools_dir}"
          "${android_cli}" --no-metrics --version
          "${android_cli}" --no-metrics --sdk="${ANDROID_HOME}" sdk install --force "platforms/android-37.0@2.0.0" --beta
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          # Google sign-in needs the Desktop client_secret on the token
          # exchange + refresh (see OAuth.kt). Injected from the repo
          # secret into BuildConfig; never printed or committed.
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: box-apk
          path: app/build/outputs/apk/debug/*.apk
